<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7aa0b0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ramp Jump" />
    <title>Ramp Jump</title>
    <link rel="icon" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="grade"></div>
    <div id="speed"></div>
    <div id="hud">
      <div id="stars" aria-hidden="true">
        <span class="star"><img src="art/icons/icon_star.webp" alt="" /></span>
        <span class="star"><img src="art/icons/icon_star.webp" alt="" /></span>
        <span class="star"><img src="art/icons/icon_star.webp" alt="" /></span>
        <span class="star"><img src="art/icons/icon_star.webp" alt="" /></span>
        <span class="star"><img src="art/icons/icon_star.webp" alt="" /></span>
      </div>
      <div id="stunts">
        <button type="button" data-stunt="launch" class="selected" aria-label="Jump">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 50 L28 50 L52 18 L52 50 Z" fill="#c46a1a"/><path d="M28 50 L52 18" stroke="#fff" stroke-width="3"/></svg>
        </button>
        <button type="button" data-stunt="loop" aria-label="Loop">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 46 H22 A14 14 0 1 1 42 46 H54" fill="none" stroke="#ff5a1f" stroke-width="6" stroke-linecap="round"/></svg>
        </button>
        <button type="button" data-stunt="quarter" aria-label="Quarter">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 50 H24 A18 18 0 0 1 42 32 V12" fill="none" stroke="#f0a202" stroke-width="6" stroke-linecap="round"/></svg>
        </button>
        <button type="button" data-stunt="gap" aria-label="Gap">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 46 L22 28 L22 46 Z" fill="#8d6230"/><ellipse cx="34" cy="48" rx="10" ry="5" fill="#3aa4c8"/><path d="M46 46 L46 34 L58 46 Z" fill="#c4a574"/></svg>
        </button>
        <button type="button" data-stunt="mega" aria-label="Mega">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 18 H24 L40 48 H58" fill="none" stroke="#ff3b30" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="cars">
        <button type="button" data-car="boy1" class="selected" aria-label="Boy 1"><img src="art/cars/toycar_red_sprite.webp" alt="" /></button>
        <button type="button" data-car="boy2" aria-label="Boy 2"><img src="art/cars/toycar_blue_sprite.webp" alt="" /></button>
        <button type="button" data-car="boy3" aria-label="Boy 3"><img src="art/cars/toycar_green_sprite.webp" alt="" /></button>
        <button type="button" data-car="boy4" aria-label="Boy 4"><img src="art/cars/toycar_yellow_sprite.webp" alt="" /></button>
      </div>
      <button id="tilt" type="button" aria-label="Tilt" aria-pressed="false">
        <img src="art/icons/icon_tilt.webp" alt="" />
      </button>
      <button id="restart" type="button" aria-label="Restart">
        <img src="art/icons/icon_restart.webp" alt="" />
      </button>
      <div id="steer">
        <button id="left" type="button" aria-label="Left"><img src="art/icons/icon_left.webp" alt="" /></button>
        <button id="right" type="button" aria-label="Right"><img src="art/icons/icon_right.webp" alt="" /></button>
      </div>
      <button id="go" type="button" aria-label="Go"><img src="art/icons/icon_go.webp" alt="" /></button>
    </div>
    <pre id="debug"></pre>
    <div id="loading" aria-hidden="true">
      <div class="loader-car"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
